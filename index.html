<script>
const API_URL = "https://lake-monitoring-api.onrender.com";

document.getElementById("waterMask").src =
    API_URL + "/water-mask";

document.getElementById("satelliteImage").src =
    API_URL + "/satellite-image";

fetch(API_URL + "/monitoring")
    .then(function(response) {
        return response.json();
    })
    .then(function(data) {

        document.getElementById("waterPercentage").textContent =
            data.detected_water_percentage + "%";

        document.getElementById("waterPixels").textContent =
            Number(data.water_pixels).toLocaleString();

        document.getElementById("totalPixels").textContent =
            Number(data.total_pixels).toLocaleString();

    })
    .catch(function(error) {
        console.error("Monitoring API error:", error);

        document.getElementById("waterPercentage").textContent =
            "API Error";

        document.getElementById("waterPixels").textContent =
            "API Error";

        document.getElementById("totalPixels").textContent =
            "API Error";
    });
</script>
